<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A2F"/>
      <stop offset="50%" stop-color="#242E49"/>
      <stop offset="100%" stop-color="#54162B"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bg6)"/>

  <!-- Cleanroom Style Cabin -->
  <rect x="70" y="55" width="260" height="135" rx="8" fill="#242E49" stroke="#37415C" stroke-width="2"/>
  <rect x="85" y="70" width="230" height="90" rx="4" fill="#181A2F"/>

  <!-- Optical Camera / Vision Alignment System -->
  <circle cx="200" cy="95" r="24" fill="#242E49" stroke="#FDA481" stroke-width="2.5"/>
  <circle cx="200" cy="95" r="14" fill="#181A2F" stroke="#B4182D" stroke-width="2"/>
  <circle cx="200" cy="95" r="5" fill="#FDA481" filter="url(#glow6)"/>

  <!-- Target Reticle / Laser Aim -->
  <line x1="200" y1="65" x2="200" y2="125" stroke="#FDA481" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="170" y1="95" x2="230" y2="95" stroke="#FDA481" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Micro-Manipulator Robotic Arms -->
  <path d="M 100 135 L 145 115 L 175 140" fill="none" stroke="#37415C" stroke-width="4"/>
  <circle cx="175" cy="140" r="4" fill="#B4182D"/>
  <path d="M 300 135 L 255 115 L 225 140" fill="none" stroke="#37415C" stroke-width="4"/>
  <circle cx="225" cy="140" r="4" fill="#B4182D"/>

  <!-- Substrate Heating Stage -->
  <rect x="150" y="145" width="100" height="12" rx="2" fill="#54162B" stroke="#B4182D" stroke-width="1"/>

  <!-- Base Machine -->
  <rect x="55" y="190" width="290" height="25" rx="6" fill="#37415C"/>

  <text x="30" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDA481" letter-spacing="1.5">NDB ONB OPTICAL BONDER</text>
  <rect x="30" y="40" width="75" height="4" rx="2" fill="#B4182D"/>
</svg>
