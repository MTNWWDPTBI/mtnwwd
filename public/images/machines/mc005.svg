<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242E49"/>
      <stop offset="70%" stop-color="#181A2F"/>
      <stop offset="100%" stop-color="#54162B"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bg5)"/>

  <!-- Multi-bay Chamber Enclosure -->
  <rect x="60" y="55" width="280" height="135" rx="10" fill="#242E49" stroke="#37415C" stroke-width="3"/>
  <rect x="75" y="70" width="250" height="85" rx="6" fill="#181A2F" stroke="#37415C" stroke-width="1.5"/>

  <!-- Three Triton Processing Heads -->
  <!-- Station 1 -->
  <rect x="95" y="80" width="45" height="40" rx="4" fill="#37415C"/>
  <rect x="110" y="120" width="15" height="25" fill="#B4182D" filter="url(#glow5)"/>
  <circle cx="117" cy="150" r="3" fill="#FDA481"/>

  <!-- Station 2 (Center Active) -->
  <rect x="175" y="75" width="50" height="45" rx="4" fill="#54162B" stroke="#B4182D" stroke-width="2"/>
  <rect x="193" y="120" width="14" height="30" fill="#FDA481" filter="url(#glow5)"/>
  <circle cx="200" cy="155" r="4" fill="#FDA481"/>

  <!-- Station 3 -->
  <rect x="255" y="80" width="45" height="40" rx="4" fill="#37415C"/>
  <rect x="270" y="120" width="15" height="25" fill="#B4182D" filter="url(#glow5)"/>
  <circle cx="277" cy="150" r="3" fill="#FDA481"/>

  <!-- Signal Tower Stack Light (Green/Yellow/Red) -->
  <rect x="330" y="65" width="12" height="60" rx="3" fill="#37415C"/>
  <circle cx="336" cy="75" r="4" fill="#B4182D" filter="url(#glow5)"/>
  <circle cx="336" cy="90" r="4" fill="#FDA481"/>
  <circle cx="336" cy="105" r="4" fill="#37415C"/>

  <!-- Machine Base -->
  <rect x="50" y="190" width="300" height="25" rx="6" fill="#37415C"/>
  <rect x="70" y="165" width="260" height="15" rx="2" fill="#54162B"/>

  <text x="30" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDA481" letter-spacing="1.5">NDB TRITON MULTI-BAY</text>
  <rect x="30" y="40" width="85" height="4" rx="2" fill="#FDA481"/>
</svg>
