<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242E49"/>
      <stop offset="60%" stop-color="#181A2F"/>
      <stop offset="100%" stop-color="#37415C"/>
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bg7)"/>

  <!-- Machine Body -->
  <rect x="70" y="70" width="260" height="115" rx="8" fill="#242E49" stroke="#37415C" stroke-width="2"/>

  <!-- Cable Feed Path (Horizontal) -->
  <line x1="50" y1="120" x2="350" y2="120" stroke="#FDA481" stroke-width="6" stroke-linecap="round" filter="url(#glow7)"/>

  <!-- Feed Roller Top and Bottom -->
  <circle cx="125" cy="98" r="18" fill="#181A2F" stroke="#37415C" stroke-width="3"/>
  <circle cx="125" cy="98" r="6" fill="#FDA481"/>
  <circle cx="125" cy="142" r="18" fill="#181A2F" stroke="#37415C" stroke-width="3"/>
  <circle cx="125" cy="142" r="6" fill="#FDA481"/>

  <!-- Center Rotary Stripping Blade Unit -->
  <rect x="180" y="80" width="40" height="80" rx="4" fill="#54162B" stroke="#B4182D" stroke-width="2"/>
  <polygon points="200,90 207,110 193,110" fill="#FDA481" filter="url(#glow7)"/>
  <polygon points="200,150 207,130 193,130" fill="#FDA481" filter="url(#glow7)"/>

  <!-- Exit Roller Top and Bottom -->
  <circle cx="275" cy="98" r="18" fill="#181A2F" stroke="#37415C" stroke-width="3"/>
  <circle cx="275" cy="98" r="6" fill="#B4182D"/>
  <circle cx="275" cy="142" r="18" fill="#181A2F" stroke="#37415C" stroke-width="3"/>
  <circle cx="275" cy="142" r="6" fill="#B4182D"/>

  <!-- Stripped Core Wire Exposure Effect -->
  <line x1="220" y1="120" x2="350" y2="120" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Base Stand -->
  <rect x="55" y="185" width="290" height="25" rx="6" fill="#37415C"/>

  <text x="30" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDA481" letter-spacing="1.5">STRIPPING SYSTEM</text>
  <rect x="30" y="40" width="60" height="4" rx="2" fill="#B4182D"/>
</svg>
